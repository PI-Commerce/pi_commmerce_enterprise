name: Deploy to Cloudflare Workers

# `main`   -> Worker `picom-enterprise-demo`   (stable demo)
# `vision` -> Worker `picom-enterprise-vision` (Ask Pi + Pi Magic + v2 surface)
# `v2`     -> Worker `pi-commerce-enterprise-v2` (v2 iteration branch)
# Each non-main target is selected by renaming the generated config after build.
# Wrangler's redirected-config format can't carry `env` blocks, so a runtime
# rewrite is the cleanest branch-to-worker mapping.
on:
  push:
    branches: [main, vision, v2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        # Thesys/Crayon GenUI SDK is large; raise Node heap so the Cloudflare bundle step
        # doesn't OOM (default ~4GB cap hit "JavaScript heap out of memory").
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # On `vision`, retarget the generated (redirected) config to the vision Worker.
      # Redirected configs can't contain `env`, so we rename the build output instead.
      - name: Point build at the vision Worker
        if: github.ref_name == 'vision'
        run: node -e "const f='dist/server/wrangler.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.name='picom-enterprise-vision';fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('Deploying Worker:',c.name)"

      - name: Point build at the v2 Worker
        if: github.ref == 'refs/heads/v2'
        run: node -e "const f='dist/server/wrangler.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.name='pi-commerce-enterprise-v2';fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('Deploying Worker:',c.name)"

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
