name: Deploy to Cloudflare Workers

# `main`   -> Worker `picom-enterprise-demo`   (stable demo)
# `vision` -> Worker `picom-enterprise-vision` (forward-looking "Pi Magic" build)
# The vision target is selected by renaming the generated config after build (see below) —
# wrangler forbids `env` blocks in the redirected/generated config this project deploys.
on:
  push:
    branches: [main, vision]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # On `vision`, retarget the generated (redirected) config to the vision Worker.
      # Redirected configs can't contain `env`, so we rename the build output instead.
      - name: Point build at the vision Worker
        if: github.ref_name == 'vision'
        run: node -e "const f='dist/server/wrangler.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.name='picom-enterprise-vision';fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('Deploying Worker:',c.name)"

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
