name: Deploy to Cloudflare Workers

# `main`   -> Worker `picom-enterprise-demo`   (stable demo)
# `vision` -> Worker `picom-enterprise-vision` (forward-looking "Pi Magic" build, via env.vision in wrangler.jsonc)
on:
  push:
    branches: [main, vision]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # On `vision`, deploy the env.vision Worker; on `main`, the base Worker.
      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy ${{ github.ref_name == 'vision' && '--env vision' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
